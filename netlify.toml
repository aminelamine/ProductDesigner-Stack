# Netlify config — deploys the static PDS Stack landing page.
#
# base = "landing"  -> Netlify runs inside landing/, which has NO package.json,
#                      so Next.js is never detected and no framework build runs.
# publish = "public" -> landing/public/ (must differ from the base directory).
# command = ""        -> nothing to build; the page is plain HTML/CSS/JS + CDN.
[build]
  base = "landing"
  publish = "public"
  command = ""

# Unknown paths fall back to the landing page (real files still serve directly).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
