# Netlify config — deploys the static PDS Stack landing page.
#
# `base = "landing"` makes Netlify run entirely inside the landing/ folder.
# That folder has no package.json, so Netlify does NOT detect Next.js and
# won't try to build the app at the repo root — it just serves the static
# files. `publish = "."` is the landing/ folder itself (relative to base).
[build]
  base = "landing"
  publish = "."
  command = ""

# Unknown paths fall back to the landing page (real files still serve directly).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
