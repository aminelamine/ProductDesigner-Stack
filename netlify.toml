# Netlify — one static bundle: the marketing landing at "/" and the
# Nextra documentation at "/docs".
#
# The build runs from the repo root: it builds the docs (Next static export
# with basePath "/docs"), then assembles dist/ = landing files + docs export.
# We publish that pre-assembled static folder directly.
[build]
  command = "cd site && npm ci && npm run build && cd .. && rm -rf dist && mkdir -p dist && cp -R landing/. dist/ && cp -R site/out dist/docs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # dist/ is already-built static output; skip Netlify's automatic Next.js
  # runtime so it doesn't try to build the root app or manage the publish dir.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Real files (landing assets and every /docs/* page) serve directly.
# Anything else falls back to the landing page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
