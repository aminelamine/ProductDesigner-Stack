# Netlify — one static bundle: the marketing landing at "/" and the
# Nextra documentation at "/docs".
#
# base = "site" so Netlify installs ONLY the docs app's dependencies (in
# sync, committed lockfile) and never touches the root demo app. The build
# assembles dist/ (inside site/) = landing files + docs export, published
# as a plain static folder.
[build]
  base = "site"
  command = "npm ci && npm run build && rm -rf dist && mkdir -p dist && cp -R ../landing/. dist/ && cp -R out dist/docs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # We publish already-built static output; skip Netlify's Next.js runtime.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Real files (landing assets and every /docs/* page) serve directly.
# Anything else falls back to the landing page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
